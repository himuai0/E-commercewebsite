kind = "web"
previewPath = "/"
title = "TMaker Store"
version = "1.0.0"
id = "artifacts/tmaker-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19546

[services.development]
run = "pnpm --filter @workspace/tmaker-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tmaker-store", "run", "build" ]
publicDir = "artifacts/tmaker-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19546"
BASE_PATH = "/"
